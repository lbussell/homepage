<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Bookmarks</h2>
                <button id="add-bookmark" class="btn-small"><i class="fas fa-plus"></i> Add</button>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search bookmarks...">
            </div>
            <div id="bookmarks-list" class="bookmarks-list">
                <!-- Bookmarks will be added here dynamically -->
            </div>
        </aside>

        <main class="main-content">
            <header>
                <h1>My Dashboard</h1>
                <div class="actions">
                    <button id="add-github" class="btn"><i class="fab fa-github"></i> Add GitHub Repo</button>
                </div>
            </header>

            <div class="content">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="all">All</button>
                    <button class="tab-btn" data-tab="github">GitHub Repos</button>
                </div>

                <div class="repo-grid" id="repos-container">
                    <!-- GitHub repos will be added here dynamically -->
                </div>
            </div>
        </main>
    </div>

    <!-- Bookmark Modal -->
    <div id="bookmark-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add Bookmark</h2>
            <form id="bookmark-form">
                <div class="form-group">
                    <label for="bookmark-title">Title</label>
                    <input type="text" id="bookmark-title" required>
                </div>
                <div class="form-group">
                    <label for="bookmark-url">URL</label>
                    <input type="url" id="bookmark-url" required>
                </div>
                <div class="form-group">
                    <label for="bookmark-icon">Icon (optional)</label>
                    <input type="text" id="bookmark-icon" placeholder="Font Awesome class (e.g., fa-globe)">
                </div>
                <div class="form-group">
                    <label for="bookmark-color">Color</label>
                    <input type="color" id="bookmark-color" value="#4285f4">
                </div>
                <button type="submit" class="btn">Save Bookmark</button>
            </form>
        </div>
    </div>

    <!-- GitHub Modal -->
    <div id="github-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add GitHub Repository</h2>
            <form id="github-form">
                <div class="form-group">
                    <label for="github-owner">Repository Owner/Organization</label>
                    <input type="text" id="github-owner" required>
                </div>
                <div class="form-group">
                    <label for="github-repo">Repository Name</label>
                    <input type="text" id="github-repo" required>
                </div>
                <div class="form-group">
                    <label for="github-color">Color</label>
                    <input type="color" id="github-color" value="#24292e">
                </div>
                <button type="submit" class="btn">Add Repository</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
