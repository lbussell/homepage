<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Bookmarks</h2>
                <button id="add-bookmark" class="btn-small"><i class="fas fa-plus"></i> Add</button>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search bookmarks...">
            </div>
            <div id="bookmarks-list" class="bookmarks-list">
                <!-- Bookmarks will be added here dynamically -->
            </div>
        </aside>

        <main class="main-content">
            <header>
                <h1 id="dashboard-title">My Dashboard</h1>
                <div class="actions">
                    <button id="settings-btn" class="btn"><i class="fas fa-cog"></i> Settings</button>
                    <button id="add-github" class="btn"><i class="fab fa-github"></i> Add Repo</button>
                </div>
            </header>

            <div class="content">
                <div class="repo-grid" id="repos-container">
                    <!-- GitHub repos will be added here dynamically -->
                </div>
            </div>
        </main>
    </div>

    <!-- Bookmark Modal -->
    <div id="bookmark-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add Bookmark</h2>
            <form id="bookmark-form">
                <div class="form-group">
                    <label for="bookmark-title">Title</label>
                    <input type="text" id="bookmark-title" required>
                </div>
                <div class="form-group">
                    <label for="bookmark-url">URL</label>
                    <input type="url" id="bookmark-url" required>
                </div>
                <button type="submit" class="btn">Save Bookmark</button>
            </form>
        </div>
    </div>

    <!-- GitHub Modal -->
    <div id="github-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add GitHub Repository</h2>
            <form id="github-form">
                <div class="form-group">
                    <label for="github-owner">Repository Owner/Organization</label>
                    <input type="text" id="github-owner" required>
                </div>
                <div class="form-group">
                    <label for="github-repo">Repository Name</label>
                    <input type="text" id="github-repo" required>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="is-azure-devops">
                    <label for="is-azure-devops">This is an Azure DevOps repository</label>
                </div>
                <div id="azure-fields-group" style="display: none;">
                    <div class="form-group">
                        <label for="azure-org">Azure DevOps Organization</label>
                        <input type="text" id="azure-org" placeholder="contoso">
                    </div>
                    <div class="form-group">
                        <label for="azure-repo">Azure DevOps Repository Name</label>
                        <input type="text" id="azure-repo" placeholder="my-project">
                    </div>
                    <div class="form-group">
                        <label for="azure-pipelines">Pipelines URL (Optional)</label>
                        <input type="url" id="azure-pipelines" placeholder="https://dev.azure.com/organization/project/_build">
                    </div>
                </div>
                <button type="submit" class="btn">Add Repository</button>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Settings</h2>
            <form id="settings-form">
                <div class="form-group">
                    <label for="page-title">Page Title</label>
                    <input type="text" id="page-title" placeholder="My Bookmarks">
                </div>
                <div class="form-group">
                    <label for="dashboard-title-input">Dashboard Title</label>
                    <input type="text" id="dashboard-title-input" placeholder="My Dashboard">
                </div>
                <div class="form-group">
                    <label for="primary-color">Primary Color</label>
                    <input type="color" id="primary-color" value="#4285f4">
                </div>
                <button type="submit" class="btn">Save Settings</button>
            </form>

            <hr class="settings-divider">

            <div class="data-management">
                <h3>Data Management</h3>
                <div class="data-buttons">
                    <button id="export-data" class="btn"><i class="fas fa-download"></i> Export Data</button>
                    <div class="import-container">
                        <label for="import-data" class="btn import-label">
                            <i class="fas fa-upload"></i> Import Data
                        </label>
                        <input type="file" id="import-data" accept=".json" style="display: none;">
                    </div>
                </div>
                <div class="reset-section">
                    <button id="reset-data" class="btn btn-danger"><i class="fas fa-trash-alt"></i> Reset All Data</button>
                    <p class="reset-warning">This will permanently delete all bookmarks, repositories, and settings.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
